plugins {
    id "com.android.library"
    id "kotlin-android"
    id "com.vanniktech.maven.publish" version "0.36.0"
}

group = "io.github.suhailpatel49"
version = "1.14.1"

android {
    namespace "com.panoramagl"
    ndkVersion "28.2.13676358"

    defaultConfig {
        minSdk 21
        compileSdk 35
        targetSdkVersion 35
    }
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "com.jakewharton.timber:timber:5.0.1"
    implementation "com.squareup.okhttp3:okhttp:5.2.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates("io.github.suhailpatel49", "panoramagl", "1.14.1")

    pom {
        name = "PanoramaGL Android"
        description = "A maintained fork of PanoramaGL Android for panoramic views on Android."
        inceptionYear = "2015"
        url = "https://github.com/suhailpatel49/panoramaGL"

        licenses {
            license {
                name = "Apache License 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }

        developers {
            developer {
                id = "suhailpatel49"
                name = "Suhail Patel"
                url = "https://github.com/suhailpatel49"
            }
        }

        scm {
            connection = "scm:git:git://github.com/suhailpatel49/panoramaGL.git"
            developerConnection = "scm:git:ssh://git@github.com/suhailpatel49/panoramaGL.git"
            url = "https://github.com/suhailpatel49/panoramaGL"
        }
    }
}
